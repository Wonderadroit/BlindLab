[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blindlab"
version = "0.1.0"
description = "Evidence-driven window blind simulation and optimization laboratory"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
blindlab = "blindlab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
