name: BlindLab validation

on:
  push:
    branches: ["main","feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Run regression tests
        run: pytest -q
      - name: Run deterministic experiment
        run: python -m blindlab --output artifacts/experiment.json
      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/experiment.json"))
          assert d["schema"]=="blindlab.experiment.v0.1"
          assert d["candidate_count"]==19
          assert 0 <= d["best"]["angle_deg"] <= 90
          assert 0 <= d["best"]["total"] <= 1
          print("Best angle:", d["best"]["angle_deg"])
          PY
      - name: Validate 3D geometry proxy
        run: |
          python - <<'PY'
          from blindlab.model import Blind
          from blindlab.solar import SunPosition
          from blindlab.experiment import geometry_validation
          r=geometry_validation(Blind(45),SunPosition(50,180,True))
          assert 0 <= r["ray_hits"] <= r["slat_count"]
          print(r)
          PY
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Render optimized scene
        run: |
          ANGLE=$(python -c 'import json; print(json.load(open("artifacts/experiment.json"))["best"]["angle_deg"])')
          blender -b --python blender/scene_v03.py -- --angle "$ANGLE" --output artifacts/blindlab_optimized.png
      - name: Validate rendered evidence
        run: |
          test -s artifacts/blindlab_optimized.png
          test -s artifacts/blindlab_optimized.json
          python - <<'PY'
          import json
          d=json.load(open("artifacts/blindlab_optimized.json"))
          assert d["schema"]=="blindlab.render.v0.3"
          assert d["calibrated_photometry"] is False
          print("Rendered evidence validated.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blindlab-v0.3-evidence
          path: artifacts/
