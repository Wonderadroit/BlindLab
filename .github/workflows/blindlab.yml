name: BlindLab validation

on:
  push:
    branches: ["main","feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest pillow
      - name: Run regression tests
        run: pytest -q
      - name: Run deterministic experiment
        run: python -m blindlab --output artifacts/experiment.json
      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/experiment.json"))
          assert d["schema"]=="blindlab.experiment.v0.1"
          assert d["candidate_count"]==19
          assert 0 <= d["best"]["angle_deg"] <= 90
          assert 0 <= d["best"]["total"] <= 1
          print("Best angle:", d["best"]["angle_deg"])
          PY
      - name: Validate photorealistic production blueprint
        run: |
          python - <<'PY'
          from blindlab.creative import FIRST_FILM, REALISM_RULES, production_prompt
          assert len(FIRST_FILM) == 5
          assert sum(s.duration_s for s in FIRST_FILM) == 15.0
          assert "no 3D-rendered or videogame appearance" in REALISM_RULES
          for shot in FIRST_FILM:
              prompt = production_prompt(shot)
              assert "Photorealistic cinematic frame" in prompt
              assert "Do not make it look like CGI" in prompt
          print("Photorealistic production blueprint validated.")
          PY
      - name: Validate photorealistic continuity quality gate
        run: python -c 'from blindlab.quality import assert_production_blueprint; assert_production_blueprint(); print("Photorealistic continuity quality gate passed.")'
      - name: Validate 3D geometry proxy
        run: |
          python - <<'PY'
          from blindlab.model import Blind
          from blindlab.solar import SunPosition
          from blindlab.experiment import geometry_validation
          r=geometry_validation(Blind(45),SunPosition(50,180,True))
          assert 0 <= r["ray_hits"] <= r["slat_count"]
          print(r)
          PY
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri
          blender --version
      - name: Render baseline and optimized scenes
        run: |
          ANGLE=$(python -c 'import json; print(json.load(open("artifacts/experiment.json"))["best"]["angle_deg"])')
          blender -b --python blender/scene_v03.py -- --angle 0 --output artifacts/baseline_open.png
          blender -b --python blender/scene_v03.py -- --angle "$ANGLE" --output artifacts/blindlab_optimized.png
          printf '%s\n' "$ANGLE" > artifacts/optimized_angle.txt
      - name: Build viewer comparison
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          a=Image.open("artifacts/baseline_open.png").convert("RGB")
          b=Image.open("artifacts/blindlab_optimized.png").convert("RGB")
          canvas=Image.new("RGB",(a.width*2,a.height),(18,18,18))
          canvas.paste(a,(0,0)); canvas.paste(b,(a.width,0))
          d=ImageDraw.Draw(canvas)
          d.rectangle((0,0,180,30),fill=(18,18,18)); d.text((10,8),"OPEN / BASELINE",fill=(245,245,245))
          d.rectangle((a.width,0,a.width+230,30),fill=(18,18,18)); d.text((a.width+10,8),"BLINDLAB / OPTIMIZED",fill=(245,245,245))
          canvas.save("artifacts/before_after.png")
          print("before_after.png created")
          PY
      - name: Validate rendered evidence
        run: |
          test -s artifacts/baseline_open.png
          test -s artifacts/blindlab_optimized.png
          test -s artifacts/before_after.png
          test -s artifacts/baseline_open.json
          test -s artifacts/blindlab_optimized.json
          python - <<'PY'
          import json
          for p in ("artifacts/baseline_open.json","artifacts/blindlab_optimized.json"):
              d=json.load(open(p))
              assert d["schema"]=="blindlab.render.v0.3"
              assert d["calibrated_photometry"] is False
          print("Rendered evidence validated.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blindlab-v0.3-evidence
          path: artifacts/
