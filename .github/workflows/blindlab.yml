name: BlindLab v0.1

on:
  push:
    branches: ["main","prototype/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Run regression tests
        run: pytest -q
      - name: Run deterministic experiment
        run: python -m blindlab --output artifacts/experiment.json
      - name: Validate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/experiment.json").read_text())
          assert d["schema"]=="blindlab.experiment.v0.1"
          assert d["candidate_count"]==19
          assert 0 <= d["best"]["angle_deg"] <= 90
          assert 0 <= d["best"]["total"] <= 1
          print("Evidence schema validated.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: blindlab-v0.1-experiment
          path: artifacts/experiment.json
